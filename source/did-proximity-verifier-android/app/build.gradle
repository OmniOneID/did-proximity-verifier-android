plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
}

android {
    namespace 'org.omnione.did.proximity.verifier'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    def major = 1
    def minor = 0
    def patch = 0

    defaultConfig {
        def date = new Date().format("yyyyMMdd")
        applicationId "org.omnione.did.proximity.verifier"
        minSdk 26
        targetSdk 36
        versionCode major * 10000 + minor * 100 + patch
        versionName "$major.$minor.$patch"
        base.archivesName = "DID_VERIFIER_${date}_v${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TAS_URL", '"http://192.168.3.110:8090"'
        buildConfigField "String", "API_GW_URL", '"http://192.168.3.110:8093"'
    }

    flavorDimensions += "env"
    productFlavors {
        prod {
            dimension "env"
        }
        // E2E automation build. Same applicationId as prod; src/qa/AndroidManifest.xml exports
        // the device engagement entry point so tests can inject a scanned engagement string with
        // `am start --es extra_payload`.
        qa {
            dimension "env"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }
}

dependencies {
    implementation files('libs/proximity-reader-1.0.0.aar')
    implementation libs.annotation
    implementation libs.upokecenter.cbor
    implementation libs.spongycastle.core
    implementation libs.spongycastle.prov

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    implementation libs.gson
    implementation libs.zxing.android.embedded

    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    testImplementation libs.junit
}
